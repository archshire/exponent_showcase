# SkyForge reverse proxy — single public entrypoint.
#   /            -> Next.js client (:3000)
#   /api/        -> Express backend (:3001), prefix stripped
#   /socket.io/  -> Express backend (:3001), websockets
# Included into the http context via /etc/nginx/conf.d.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream skyforge_client {
  server client:3000;
}

upstream skyforge_server {
  server server:3001;
}

# Redirect plain HTTP to HTTPS.
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;

  # Allow base64 image uploads (profile pictures) through the proxy.
  client_max_body_size 12m;

  # REST API — strip the /api prefix before forwarding.
  location /api/ {
    proxy_pass http://skyforge_server/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Realtime (matchmaking, live match, community chat).
  location /socket.io/ {
    proxy_pass http://skyforge_server/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
  }

  # Everything else -> Next.js frontend.
  location / {
    proxy_pass http://skyforge_client;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
