name: CI

on:
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'apps/client/**'
            server:
              - 'apps/server/**'

  client:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: cd apps/client && pnpm ci

      # LINTING
      - name: Lint client
        run: cd apps/client && pnpm run lint

      # TESTING
      - name: Test client
        run: cd apps/client && pnpm run test

      # BUILDING
      - name: Build client
        run: cd apps/client && pnpm run build

  server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: cd apps/server && pnpm ci

      # LINTING
      - name: Lint server
        run: cd apps/server && pnpm run lint

      # TESTING
      - name: Test server
        run: cd apps/server && pnpm run test

      # BUILDING
      - name: Build server
        run: cd apps/server && pnpm run build


# When Tech Stack is Finalized
# 	1. Scaffold projects (generate package.json)
# 	# For client (if using Next.js)
# 	npx create-next-app@latest client --typescript
# 	# For server (manually or via scaffold tool)
# 	# Create package.json with Express, etc.

# 	2. Switch to issue branch:
# 	git checkout chore/CI/setup-pnpm-workflow

# 	3. Generate lock files:
# 	cd client && pnpm install --frozen-lockfile
# 	cd server && pnpm install --frozen-lockfile

# 	4. Commit the lock files:
# 	git add client/package.json client/pnpm-lock.yaml
# 	git add server/package.json server/pnpm-lock.yaml
# 	git commit -m "chore: add pnpm lock files"
# 	git push origin chore/CI/setup-pnpm-workflow

# Now create the PR to main — CI will pass because lock files exist

# Jobs are currently set to by-package (i.e. client, server)
# Switch to by-tasks if the CI time becomes a bottleneck (i.e. lint, test, build)

# Used pnpm instead of npm due to:
  # Faster install
  # Better monorepo support (builtin workspaces)
  # Stricter dependency management
  # Disk space efficient (hardlinks instead of copies)