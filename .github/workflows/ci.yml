name: CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'apps/client/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            server:
              - 'apps/server/**'
              - 'packages/shared/**'
              - 'packages/db/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'

  client:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pnpm action setup
        uses: pnpm/action-setup@v6
        with:
           version: 10.33.2
           cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint client
        run: pnpm --filter ./apps/client run lint

      - name: Test client
        run: pnpm --filter ./apps/client run test --if-present

      - name: Build client
        run: pnpm --filter ./apps/client run build

  server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pnpm action setup
        uses: pnpm/action-setup@v6
        with:
           version: 10.33.2
           cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint server
        run: pnpm --filter ./apps/server run lint

      - name: Test server
        run: pnpm --filter ./apps/server run test --if-present

      - name: Build server
        run: pnpm --filter ./apps/server run build


# CI/CD Workflow Structure:
# 
# Triggers:
#   - Pull requests to main and dev branches
#   - Push commits to dev branch
#
# Job Flow:
#   1. detect-changes: Identifies which apps (client/server) have changed
#   2. client: Runs lint, test, build for client (only if client code changed)
#   3. server: Runs lint, test, build for server (only if server code changed)
#
# Key Features:
#   - Monorepo-aware: Uses pnpm --filter to run commands per workspace
#   - Smart caching: Uses setup-node's cache: 'pnpm' for efficient dependency caching
#   - Conditional execution: Only runs jobs for changed apps (detect-changes gates)
#   - Dependency tracking: Detects changes in shared packages and root config files
#
# Performance notes:
#   - Jobs run in parallel (client/server don't block each other)
#   - Cache hit avoids reinstalling dependencies on every run
#   - Freezing lock file (pnpm install --frozen-lockfile) ensures consistency

# Used pnpm instead of npm due to:
  # Faster install
  # Better monorepo support (builtin workspaces)
  # Stricter dependency management
  # Disk space efficient (hardlinks instead of copies)

  