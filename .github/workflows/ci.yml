name: CI

on:
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'client/**'
            server:
              - 'server/**'

  client:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: cd client && pnpm ci

      # LINTING
      - name: Lint client
        run: cd client && pnpm run lint

      # TESTING
      - name: Test client
        run: cd client && pnpm run test

      # BUILDING
      - name: Build client
        run: cd client && pnpm run build

  server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: cd server && pnpm ci

      # LINTING
      - name: Lint server
        run: cd server && pnpm run lint

      # TESTING
      - name: Test server
        run: cd server && pnpm run test

      # BUILDING
      - name: Build server
        run: cd server && pnpm run build


# Jobs are currently set to by-package (i.e. client, server)
# Switch to by-tasks if the CI time becomes a bottleneck (i.e. lint, test, build)

# Used pnpm instead of npm due to:
  # Faster install
  # Better monorepo support (builtin workspaces)
  # Stricter dependency management
  # Disk space efficient (hardlinks instead of copies)