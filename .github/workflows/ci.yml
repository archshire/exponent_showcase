name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'apps/client/**'
            server:
              - 'apps/server/**'

  install:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.pnpm-cache.outputs.cache-hit }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  client:
    needs: [detect-changes, install]
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint client
        run: pnpm --filter client run lint

      - name: Test client
        run: pnpm --filter client run test

      - name: Build client
        run: pnpm --filter client run build

  server:
    needs: [detect-changes, install]
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint server
        run: pnpm --filter server run lint

      - name: Test server
        run: pnpm --filter server run test

      - name: Build server
        run: pnpm --filter server run build


# CI/CD Workflow Structure:
# 
# Triggers:
#   - Pull requests to main and dev branches
#   - Push commits to dev branch
#
# Job Flow:
#   1. detect-changes: Identifies which apps (client/server) have changed
#   2. install: Sets up Node, enables pnpm, caches dependencies (runs once)
#   3. client: Runs lint, test, build for client (only if client code changed)
#   4. server: Runs lint, test, build for server (only if server code changed)
#
# Key Features:
#   - Monorepo-aware: Uses pnpm --filter to run commands per workspace
#   - Smart caching: Centralized pnpm store cache invalidated by pnpm-lock.yaml
#   - Conditional execution: Only runs jobs for changed apps (detect-changes gates)
#   - Modern pnpm setup: Uses corepack enable instead of npm install -g pnpm
#
# Performance notes:
#   - Jobs run in parallel (client/server don't block each other)
#   - Cache hit avoids reinstalling dependencies on every run
#   - Freezing lock file (pnpm install --frozen-lockfile) ensures consistency

# Used pnpm instead of npm due to:
  # Faster install
  # Better monorepo support (builtin workspaces)
  # Stricter dependency management
  # Disk space efficient (hardlinks instead of copies)