name: Bug Report
description: Report a bug to help us improve
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 📝 Description
      description: Clear and concise description of the bug
      placeholder: Describe what's happening...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔍 Steps to Reproduce
      description: Steps to reproduce the bug
      placeholder: |
        1. Step 1
        2. Step 2
        3. Step 3
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected Behavior
      description: What should happen?
      placeholder: Describe expected behavior...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ Actual Behavior
      description: What is actually happening?
      placeholder: Describe actual behavior...
    validations:
      required: true

  - type: section
    attributes:
      label: 🌍 Environment

  - type: dropdown
    id: frontend
    attributes:
      label: Frontend
      options:
        - React
        - Vue
        - Angular
        - Other
    validations:
      required: true

  - type: input
    id: frontend-version
    attributes:
      label: Frontend Version
      placeholder: "e.g., 18.0.0"

  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Node.js/Express
        - Python/FastAPI
        - Python/Django
        - Other
    validations:
      required: true

  - type: input
    id: backend-version
    attributes:
      label: Backend Version
      placeholder: "e.g., 18.0.0"

  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - MongoDB
        - MySQL
        - PostgreSQL
        - Redis
        - Other
    validations:
      required: true

  - type: input
    id: db-version
    attributes:
      label: Database Version
      placeholder: "e.g., 8.0.0"

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: Browser Version
      placeholder: "e.g., 120.0"

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 📸 Screenshots or Logs
      description: Add screenshots, error messages, or logs if applicable
      placeholder: Paste screenshots, error traces, or console logs here...

  - type: textarea
    id: context
    attributes:
      label: ℹ️ Additional Context
      description: Any other relevant information
      placeholder: Add any other context here...
